<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Power of Sequencing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>The Power of Sequencing</h1>
  <p>Same three pictures, but the order changes the story. Pick a story below!</p>

  <div>
    <button id="storyABtn" class="selected">Story A</button>
    <button id="storyBBtn">Story B</button>
  </div>

  <h2 id="title"></h2>

  <img id="pic" src="img1.jpg" alt="One Piece scene">

  <h3 id="stage"></h3>
  <p id="caption"></p>

  <div>
    <button id="backBtn">Back</button>
    <span id="counter"></span>
    <button id="nextBtn">Next</button>
  </div>

  <p class="note">(you can also click the picture)</p>

  <script src="script.js"></script>
</body>
</html>
